<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- the one face the first screen shows (the bars), fetched before the
    styles ask for it (src/scss/_typography.scss, served from public/fonts/
    as it is); the hidden editor is in the system's font, so no other face
    loads at the start -->
    <link
      rel="preload"
      href="/fonts/IBMPlexSans-Regular.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <script type="module" src="/src/main.ts" defer></script>
    <title>Blank</title>
  </head>

  <body data-theme="light">
    <div id="app"></div>
  </body>
</html>
