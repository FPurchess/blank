# The snap repackages the .deb of a GitHub release, so it runs the same binary as the other
# Linux packages. CI (.github/workflows/distribute.yml) downloads it as blank.deb next to this
# folder. WebKitGTK, GTK and friends come from the gnome extension's gnome-46-2404 runtime;
# don't stage them, mixing WebKit versions breaks the webview.
name: blank-editor
title: Blank
base: core24
adopt-info: blank
summary: A quiet place to write markdown
description: |
  Blank is a minimalist markdown editor made for writing. There are no toolbars, no buttons,
  no panels asking for your attention: there is the page and the sentence you are writing.

  - Your hands stay on the keyboard: headings, lists, links and emphasis are one shortcut,
    or one typed character, away
  - Quotes curl, dashes find their length and sentences start with a capital, in 14
    languages, as you type
  - Close the window mid-thought and Blank keeps your words for the next time you open it
  - Plain markdown files, exported as carefully typeset PDFs or Word documents
  - Light, dark and colored themes, and shortcuts you can rebind

  Open any file with Mod+O. From the terminal, `blank-editor notes.md` opens files in your
  home folder that aren't hidden. For USB drives and other disks, run
  `sudo snap connect blank-editor:removable-media` once.
license: AGPL-3.0-only
icon: src-tauri/icons/128x128@2x.png
website: https://fpurchess.github.io/blank/
source-code: https://github.com/FPurchess/blank
issues: https://github.com/FPurchess/blank/issues
contact: https://github.com/FPurchess/blank/issues
grade: stable
confinement: strict

platforms:
  amd64:

apps:
  blank-editor:
    command: usr/bin/blank
    desktop: usr/share/applications/blank.desktop
    # adds the desktop, wayland, x11, opengl and gsettings plugs and the portals, so the
    # open and save dialogs reach any file the user picks
    extensions: [gnome]
    plugs:
      # files passed on the command line
      - home
      # spell check dictionaries and web images in the editor and the exports
      - network
      # WebKit asks the portal for the proxy settings before loading web images
      - network-status
      # not connected automatically, see the description
      - removable-media

parts:
  blank:
    plugin: dump
    source: blank.deb
    source-type: deb
    override-build: |
      craftctl default
      craftctl set version="$(dpkg-deb -f "$CRAFT_PROJECT_DIR/blank.deb" Version)"
      # the deb's icon name doesn't resolve inside the snap, use the one from icon: above
      sed -i 's|^Icon=.*|Icon=${SNAP}/meta/gui/icon.png|' \
        "$CRAFT_PART_INSTALL/usr/share/applications/blank.desktop"
