# The snap repackages the .deb of a GitHub release, so it runs the same binary as the other
# Linux packages. CI (.github/workflows/distribute.yml) downloads it as blank.deb next to this
# folder. WebKitGTK, GTK and friends come from the gnome extension's gnome-46-2404 runtime;
# don't stage them, mixing WebKit versions breaks the webview.
# The summary and description come from the release's own AppStream metainfo (parse-info
# below), so the store listing always describes the version it ships.
name: blank
title: Blank
base: core24
adopt-info: blank
license: AGPL-3.0-only
icon: src-tauri/icons/128x128@2x.png
website: https://blank-writer.xyz/
source-code: https://github.com/FPurchess/blank
issues: https://github.com/FPurchess/blank/issues
contact: https://github.com/FPurchess/blank/issues
grade: stable
confinement: strict

platforms:
  amd64:

apps:
  blank:
    command: usr/bin/blank
    desktop: usr/share/applications/blank.desktop
    # adds the desktop, wayland, x11, opengl and gsettings plugs and the portals, so the
    # open and save dialogs reach any file the user picks
    extensions: [gnome]
    plugs:
      # files passed on the command line
      - home
      # spell check dictionaries and web images in the editor and the exports
      - network
      # WebKit asks the portal for the proxy settings before loading web images
      - network-status
      # not connected automatically, see the description
      - removable-media

parts:
  blank:
    plugin: dump
    source: blank.deb
    source-type: deb
    parse-info: [usr/share/metainfo/io.github.fpurchess.blank.metainfo.xml]
    override-build: |
      craftctl default
      craftctl set version="$(dpkg-deb -f "$CRAFT_PROJECT_DIR/blank.deb" Version)"
      # the release's own desktop entry, so Exec matches the arguments its binary takes, with
      # the icon from icon: above, since the deb's icon name doesn't resolve inside the snap
      sed -i 's|^Icon=.*|Icon=${SNAP}/meta/gui/icon.png|' \
        "$CRAFT_PART_INSTALL/usr/share/applications/blank.desktop"
