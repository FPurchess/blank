name: "install what the app needs to run under WebDriver"
description: "Installs WebKitGTK, its WebDriver and a virtual display, shared by the E2E tests and the docs screenshots"

inputs:
  ffmpeg:
    description: "also install ffmpeg, which the docs screenshots turn their frames into GIFs with"
    default: "false"

runs:
  using: composite
  steps:
    # `webkit2gtk-driver` provides WebKitWebDriver, `xvfb` a virtual display, and `xclip`
    # the X selection the middle-click paste spec sets
    - name: install system dependencies
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libwebkit2gtk-4.1-dev \
          build-essential \
          curl \
          wget \
          file \
          libxdo-dev \
          libssl-dev \
          libayatana-appindicator3-dev \
          librsvg2-dev \
          webkit2gtk-driver \
          xclip \
          xvfb \
          ${{ inputs.ffmpeg == 'true' && 'ffmpeg' || '' }}
        # the desktop portal is registered with D-Bus but never comes up on the runner, so WebKitGTK
        # and tao wait for its timeouts (~30s) on every app start. Without the service file, the
        # lookups fail immediately.
        sudo rm -f /usr/share/dbus-1/services/org.freedesktop.portal.Desktop.service
