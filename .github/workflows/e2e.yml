name: E2E

# Runs the E2E tests on the debug build. On a push to main, it hands the build on to the
# Screenshots workflow (.github/workflows/screenshots.yml), which captures the docs screenshots
# with it once the tests passed.
on:
  # a pull request runs on every push to it, so other branches don't run
  # twice; main still runs after each merge
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    # runs for every pull request, even though pushes run it too: `e2e` is a required check,
    # and a skipped job would count as passed before the push run is done
    # tauri-driver supports Linux and Windows only (no WKWebView driver on macOS). Windows runners are
    # elevated, which makes WebView2 ignore the debugging port msedgedriver needs, see
    # https://github.com/actions/runner-images/issues/14738
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/webkit-deps

      - uses: oven-sh/setup-bun@v2

      # WebdriverIO requires node >= 18.20
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          build-warnings: warn
          cache-workspaces: src-tauri -> target

      # ~/.cargo/bin is cached by the rust toolchain setup, hence this is a no-op on subsequent runs
      - name: install tauri-driver
        run: cargo install tauri-driver --locked --version 2.0.6

      - name: install app dependencies
        run: bun install

      - name: install e2e dependencies
        run: bun install --frozen-lockfile
        working-directory: e2e

      - name: typecheck e2e tests
        run: bun run typecheck
        working-directory: e2e

      - name: build app
        run: bun run tauri build --debug --no-bundle

      # a session bus, which Blank needs to run as one instance and hand the
      # files of a second start to the first (src-tauri/src/open.rs)
      - name: run e2e tests
        run: dbus-run-session -- xvfb-run --auto-servernum bun run test
        working-directory: e2e
        env:
          E2E_SKIP_BUILD: 1

      - name: upload screenshots of failed tests
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-screenshots
          path: e2e/screenshots
          if-no-files-found: ignore

      # the debug build embeds the frontend and the built-in dictionaries, so the binary is all
      # the Screenshots workflow needs
      - name: upload the app for the screenshots
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: app-debug
          path: src-tauri/target/debug/blank
          retention-days: 1
          if-no-files-found: error
