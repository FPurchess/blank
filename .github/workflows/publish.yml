name: "publish"
on:
  push:
    branches:
      - release

jobs:
  # a release never ships a wasm that isn't what the engine's sources build
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # MuPDF's licence files, which the third-party notices quote
          submodules: recursive
      - uses: oven-sh/setup-bun@v2
      - uses: ./.github/actions/engine

  publish-tauri:
    needs: engine
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest # Apple Silicon
            args: --target aarch64-apple-darwin
            rust-target: aarch64-apple-darwin
          - platform: macos-latest # Intel
            args: --target x86_64-apple-darwin
            rust-target: x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ""
            rust-target: ""
          - platform: windows-latest
            args: ""
            rust-target: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7
        with:
          # MuPDF, which the PDF helper is built from
          submodules: recursive
      - uses: oven-sh/setup-bun@v2
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: ${{ matrix.rust-target }}

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      # tauri-action builds the frontend and the PDF helper itself via
      # beforeBuildCommand
      - name: install app dependencies
        run: bun install

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__ # the action automatically replaces \_\_VERSION\_\_ with the app version
          releaseName: "Blank v__VERSION__"
          releaseBody: "See the assets to download this version and install. On macOS, see https://blank-writer.xyz/guide/install#macos if the app is blocked."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      # An arm64 bundle that is only linker-signed shows as "damaged" on macOS. See issue #17.
      - name: verify bundle signature (macOS only)
        if: startsWith(matrix.platform, 'macos')
        run: |
          app=src-tauri/target/${{ matrix.rust-target }}/release/bundle/macos/blank.app
          codesign -dv --verbose=2 "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          [ -d "$app/Contents/_CodeSignature" ]

      # Linux builds stay on ubuntu-22.04 so the binary runs on glibc >= 2.35 (Debian 12, Ubuntu 22.04). See issue #8.
      - name: check glibc floor (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          for binary in blank blank-pdf; do
            max=$(objdump -T src-tauri/target/release/$binary | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)
            echo "$binary: highest required glibc symbol: $max"
            [ "$(printf '%s\n' "$max" GLIBC_2.35 | sort -V | tail -1)" = GLIBC_2.35 ]
          done
