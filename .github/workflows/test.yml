name: Tests

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' || github.ref != 'refs/heads/main' }}

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
      - uses: oven-sh/setup-bun@v2

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: |
          bun install
          bun run lint
          bun run format:check
          bun run test:coverage

      # app stores and software centers read these, see src-tauri/linux/
      - name: validate desktop entry and AppStream metadata
        run: |
          sudo apt-get update
          sudo apt-get install -y appstream desktop-file-utils
          appstreamcli validate --pedantic --no-net src-tauri/linux/io.github.fpurchess.blank.metainfo.xml
          sed 's/{{exec}}/blank/g; s/{{icon}}/blank/g' src-tauri/linux/blank.desktop > "$RUNNER_TEMP/blank.desktop"
          desktop-file-validate "$RUNNER_TEMP/blank.desktop"
