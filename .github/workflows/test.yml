name: Tests

on:
  # a pull request runs on every push to it, so other branches don't run
  # twice; main still runs after each merge
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' || github.ref != 'refs/heads/main' }}

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          # the base of a pull request, for the screenshots check below
          fetch-depth: 2

      # the E2E workflow captures the docs screenshots on main and proposes them in a PR from
      # bot/screenshots; a pull request that commits them would undo the changes of others. On a
      # pull request, HEAD is the merge commit and HEAD^1 the base.
      - name: leave the screenshots to CI
        if: github.event_name == 'pull_request'
        run: |
          if git diff --name-only HEAD^1 HEAD -- docs/public/screenshots | grep -q .; then
            echo "::error::docs/public/screenshots is captured on main and proposed in the screenshots PR; drop it from this PR: git checkout origin/main -- docs/public/screenshots"
            exit 1
          fi

      - uses: oven-sh/setup-bun@v2

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # pdftotext and pdfinfo, which check the engine's PDF against its
      # layout, and the Chinese font src/engine/exact.test.ts lays out with
      - name: install poppler and a CJK font
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils fonts-noto-cjk

      - run: |
          bun install
          bun run lint
          bun run format:check
          bun run test:coverage

      # app stores and software centers read these, see src-tauri/linux/
      - name: validate desktop entry and AppStream metadata
        run: |
          sudo apt-get update
          sudo apt-get install -y appstream desktop-file-utils
          appstreamcli validate --pedantic --no-net src-tauri/linux/io.github.fpurchess.blank.metainfo.xml
          sed 's/{{exec}}/blank/g; s/{{icon}}/blank/g' src-tauri/linux/blank.desktop > "$RUNNER_TEMP/blank.desktop"
          desktop-file-validate "$RUNNER_TEMP/blank.desktop"

  # the layout engine: its tests, and whether the committed wasm is what its
  # sources build (scripts/build-engine.sh builds it reproducibly). The
  # publish workflow runs the same check before it builds a release, and
  # make release requires it on origin/main
  engine:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      # MuPDF's licence files, which the third-party notices quote
      - uses: ./.github/actions/mupdf
      - uses: oven-sh/setup-bun@v2
      - uses: ./.github/actions/engine

  # the PDF helper (src-tauri/pdf): the protocol and the client against a
  # fake helper, MuPDF on the fixtures (the Chinese one with the system's
  # font, from fonts-noto-cjk), and whether the notices list the C libraries
  # its build compiles. A required check of main.
  pdf:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          cache-workspaces: src-tauri -> target
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
      # MuPDF, and its build output while it didn't change: the tests and
      # the notices check link and read the same libmupdf.a
      - uses: ./.github/actions/mupdf
        with:
          build: true

      - name: install poppler, qpdf and a CJK font
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils qpdf fonts-noto-cjk

      # optimized, as the app ships it: MuPDF built for debugging is slow
      - name: test the helper
        run: cargo test --release --manifest-path src-tauri/Cargo.toml -p blank-pdf-ipc -p blank-pdf -p blank-system-fonts

      - name: check the notices of MuPDF's libraries
        run: bun scripts/check-mupdf-notices.ts
