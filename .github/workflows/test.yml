name: Tests

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' || github.ref != 'refs/heads/main' }}

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
      - uses: oven-sh/setup-bun@v2

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # pdftotext and pdfinfo, which check the engine's PDF against its
      # layout, and the Chinese font src/engine/exact.test.ts lays out with
      - name: install poppler and a CJK font
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils fonts-noto-cjk

      - run: |
          bun install
          bun run lint
          bun run format:check
          bun run test:coverage

      # app stores and software centers read these, see src-tauri/linux/
      - name: validate desktop entry and AppStream metadata
        run: |
          sudo apt-get update
          sudo apt-get install -y appstream desktop-file-utils
          appstreamcli validate --pedantic --no-net src-tauri/linux/io.github.fpurchess.blank.metainfo.xml
          sed 's/{{exec}}/blank/g; s/{{icon}}/blank/g' src-tauri/linux/blank.desktop > "$RUNNER_TEMP/blank.desktop"
          desktop-file-validate "$RUNNER_TEMP/blank.desktop"

  # the layout engine: its tests, and whether the committed wasm is what its
  # sources build (scripts/build-engine.sh builds it reproducibly)
  engine:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@master
        with:
          # RUST_VERSION in scripts/build-engine.sh
          toolchain: 1.98.1
          targets: wasm32-unknown-unknown

      - name: install poppler and wasm-bindgen
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          # the version of the wasm-bindgen crate in src-tauri/Cargo.lock
          cargo install wasm-bindgen-cli --version 0.2.129 --locked

      - name: test the engine
        run: cargo test --manifest-path src-tauri/Cargo.toml -p blank-layout

      - name: check the committed wasm
        run: |
          bash scripts/build-engine.sh
          git diff --exit-code --stat src/engine/wasm ||
            { echo "::error::src/engine/wasm isn't what the engine's sources build: run make engine"; exit 1; }
