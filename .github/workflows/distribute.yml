name: Distribute

# Publishes a release to the package registries once it's published on GitHub. publish.yml only
# creates a draft, whose assets can't be downloaded yet, so this runs on `release: published`.
# Run it by hand with a tag to retry a registry or to publish an older release. Pull requests
# that touch the packaging build the snap from the latest release without publishing it, and
# attach it to the run for testing.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish, e.g. v2.0.0"
        required: true
  pull_request:
    paths:
      - "snap/**"
      - ".github/workflows/distribute.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.release.tag_name || inputs.tag || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  snap:
    # prereleases stay on GitHub
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: download the release's .deb
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          # pull requests test against the latest release
          gh release download ${TAG:+"$TAG"} --repo "$GITHUB_REPOSITORY" --pattern '*_amd64.deb' --output blank.deb
          dpkg-deb --info blank.deb | grep -E '^ (Package|Version):'

      - uses: snapcore/action-build@v1
        id: build

      - name: show the desktop entry as installed
        env:
          SNAP_FILE: ${{ steps.build.outputs.snap }}
        run: unsquashfs -cat "$SNAP_FILE" meta/gui/blank-editor.desktop

      - uses: actions/upload-artifact@v7
        with:
          name: snap
          path: ${{ steps.build.outputs.snap }}
          retention-days: 7

      - uses: snapcore/action-publish@v1
        if: github.event_name != 'pull_request'
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        with:
          snap: ${{ steps.build.outputs.snap }}
          release: stable
