name: "test-on-pr"
on:
  pull_request:
  # builds on main seed the Rust cache that pull requests restore from
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test-tauri:
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, ubuntu-22.04, windows-latest]

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          cache-workspaces: src-tauri -> target
          # only main saves, so pull requests don't evict its cache with their own copies
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: setup node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      # tauri-action builds the frontend through beforeBuildCommand
      - name: install app dependencies
        run: bun install

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # the spell check engine, on every platform. tauri-action has built the frontend
      # (dist/), which the Rust side needs to compile
      - name: run rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      # Linux builds stay on ubuntu-22.04 so the binary runs on glibc >= 2.35 (Debian 12, Ubuntu 22.04). See issue #8.
      - name: check glibc floor (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          max=$(objdump -T src-tauri/target/release/blank | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)
          echo "highest required glibc symbol: $max"
          [ "$(printf '%s\n' "$max" GLIBC_2.35 | sort -V | tail -1)" = GLIBC_2.35 ]

      - name: check desktop entry and AppStream metadata in the packages (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          meta=usr/share/metainfo/io.github.fpurchess.blank.metainfo.xml
          dpkg-deb -x src-tauri/target/release/bundle/deb/*.deb "$RUNNER_TEMP/deb"
          ls -R "$RUNNER_TEMP/deb/usr/share"
          test -f "$RUNNER_TEMP/deb/$meta" || { echo "::error::the .deb has no $meta"; exit 1; }
          cat "$RUNNER_TEMP/deb/usr/share/applications/blank.desktop"
          grep -qx 'Exec=blank %f' "$RUNNER_TEMP/deb/usr/share/applications/blank.desktop" ||
            { echo "::error::the .deb's desktop entry doesn't pass the file to blank"; exit 1; }
          sudo apt-get install -y rpm
          rpm -qlp src-tauri/target/release/bundle/rpm/*.rpm | tee "$RUNNER_TEMP/rpm.txt"
          grep -qx "/$meta" "$RUNNER_TEMP/rpm.txt" || { echo "::error::the .rpm has no /$meta"; exit 1; }
