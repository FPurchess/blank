# The licences of the Rust crates Blank ships: the app (src-tauri) on every
# platform it's built for, and the layout engine in the webview (wasm32).
# See scripts/build-notices.ts.
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "x86_64-pc-windows-msvc",
  "wasm32-unknown-unknown",
]
ignore-build-dependencies = true
ignore-dev-dependencies = true
# the first one a crate offers is the one listed
accepted = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "MPL-2.0",
  "BSL-1.0",
  "CDLA-Permissive-2.0",
  "CC0-1.0",
  "0BSD",
  "Unlicense",
  "MIT-0",
  # Blank itself, which build-notices.ts leaves out
  "AGPL-3.0-only",
]
