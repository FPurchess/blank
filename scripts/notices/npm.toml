# Clarifies the npm packages of scripts/build-notices.ts. An entry is for one
# version (name@version), so that an update has to be checked again, or for
# every version (name) where that doesn't matter.
#
# license: the licence, as an SPDX expression, when package.json doesn't
#   give it as one
# text-from: the file whose first section on a licence has the licence's
#   text, read instead of the licence files
# ignore: why the package is left out: none of its code reaches the bundle
# inlines: the packages a pre-built package has inside, as name@version in
#   the versions it was built with. The licences of those Blank doesn't
#   install are in vendored/<name>@<version>/, with their package.json.

# "BSD" in package.json; its LICENSE has two clauses
["duck@0.1.12"]
license = "BSD-2-Clause"

# no licence file
["hash.js@1.1.7"]
text-from = "README.md"

["isarray@1.0.0"]
text-from = "README.md"

# LICENSE.md also has the licences of what Vite's own build tool has
# inside, of which the bundle has nothing: only Vite's helpers end up in it
["vite"]
text-from = "LICENSE.md"

# for the command line tools of markdown-it and mammoth
["argparse"]
ignore = "only the command line tools of markdown-it and mammoth use it"

# docx's dist/ is built with Rolldown and vite-plugin-node-polyfills; the
