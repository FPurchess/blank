[package]
name = "blank"
version = "3.0.0"
description = "Blank is a minimalist, opinionated markdown editor made for writing - keyboard-first with PDF-Export, available for Linux, macOS and Windows"
authors = ["Florian Purchess <florian.purchess@googlemail.com>"]
license = "AGPL-3.0-only"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "blank_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[workspace]
members = ["layout", "drawings", "system-fonts", "pdf/ipc", "pdf/helper"]

# MuPDF 1.28.5 from the submodule, built by mupdf-sys 0.8.0's glue, see
# pdf/mupdf-sys/Cargo.toml and .claude/rules/pdf.md
[patch.crates-io]
mupdf-sys = { path = "pdf/mupdf-sys" }

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-notification = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2.4"
# the minor version must match @tauri-apps/plugin-http
tauri-plugin-http = "~2.8"
spellbook = "0.4"
sha2 = { version = "0.10", features = ["oid"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "stream"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
futures-util = { version = "0.3", default-features = false }
tokio = { version = "1", features = ["fs", "sync", "time"] }
# what comes with the print PDF, encoded for a header (src/print/mod.rs),
# and the header the webview encodes with encodeURIComponent
# (src/signing/commands.rs)
percent-encoding = "2"
# the PDF tabs' helper (src/pdf_view), which draws them with MuPDF in a
# process of its own: this side of it only speaks its protocol
blank-pdf-ipc = { path = "pdf/ipc" }
# the system's fonts for scripts Blank's fonts lack, see src/fonts.rs
blank-system-fonts = { path = "system-fonts" }
# Blank's log, in the system's log folder (src/logging.rs); log is the
# facade it and Tauri's crates write through. The minor version must match
# @tauri-apps/plugin-log.
tauri-plugin-log = "~2.10"
log = "0.4"
# signing PDFs (src/signing/): the incremental update, CMS, the user's
# certificate and key. One generation of RustCrypto (der 0.7), which cms 0.2
# and p12-keystore 0.2 share; see .claude/rules/signing.md
lopdf = { version = "=0.45.0", default-features = false }
cms = { version = "=0.2.3", features = ["builder"] }
x509-cert = "0.2"
der = { version = "0.7", features = ["alloc", "oid"] }
spki = "0.7"
const-oid = { version = "0.9", features = ["db"] }
p256 = { version = "0.13", features = ["ecdsa", "pkcs8"] }
p384 = { version = "0.13", features = ["ecdsa"] }
rsa = { version = "0.9", features = ["sha2"] }
sha1 = { version = "0.10", features = ["oid"] }
rcgen = { version = "0.14", default-features = false, features = ["ring"] }
p12-keystore = "=0.2.1"
# reads the MAC of a key file, and the BER files NSS (Firefox, Thunderbird)
# exports; the version p12-keystore uses
pkcs12 = "0.1"
rand_core = { version = "0.6", features = ["getrandom"] }
hex = "0.4"
anyhow = "1"
time = "0.3"
# wipes the passphrase once it's used
zeroize = "1"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-cli = "2"
# every file opened becomes a tab in the running window (src/open.rs)
tauri-plugin-single-instance = "2.5"

# the primary selection, which a middle click pastes (src/primary.rs); the
# version tauri's webview already uses
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
# whether there is a session bus for the single-instance plugin (src/open.rs);
# the version it uses
zbus = "5"
# names Blank's window for the print portal's dialog, on X11 and Wayland
# (src/print/linux.rs); on zbus's async-io, as above
ashpd = { version = "0.13", default-features = false, features = ["async-io", "raw_handle", "wayland"] }
raw-window-handle = "0.6"
# runs the print portal's calls on a thread of their own (src/print/linux.rs)
async-io = "2"

# the print panel for the print PDF (src/print/macos.rs); the versions tauri's
# webview already uses
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSData", "NSDictionary", "NSGeometry", "NSObject", "NSString", "NSValue", "objc2-core-foundation"] }
objc2-app-kit = { version = "0.3", features = ["NSPrintInfo", "NSPrintOperation", "NSPrinter"] }
objc2-pdf-kit = { version = "0.3", features = ["PDFDocument", "objc2-app-kit"] }

# WebView2's print dialog for the print PDF (src/print/windows.rs); the
# versions tauri's webview already uses
[target.'cfg(target_os = "windows")'.dependencies]
webview2-com = "0.39"
windows = "0.62"

[dev-dependencies]
tempfile = "3"
tiny_http = "0.12"

# checking and suggesting are slow without optimizations, which would make
# `tauri dev` and the debug builds of the e2e tests lag
[profile.dev.package.spellbook]
opt-level = 3

# the key's 600,000 rounds of PBKDF2, and RSA, take minutes unoptimized:
# signing in `tauri dev` and the tests needs them optimized. PBKDF2 is
# generic, so it is compiled into the crates that use it: pkcs5 (PBES2, the
# key's encryption), pkcs12 (the MAC's key) and p12-keystore (the MAC)
[profile.dev.package.pbkdf2]
opt-level = 3
[profile.dev.package.pkcs5]
opt-level = 3
[profile.dev.package.pkcs12]
opt-level = 3
[profile.dev.package.p12-keystore]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.sha1]
opt-level = 3
[profile.dev.package.hmac]
opt-level = 3
[profile.dev.package.digest]
opt-level = 3
[profile.dev.package.aes]
opt-level = 3
[profile.dev.package.cbc]
opt-level = 3
[profile.dev.package.num-bigint-dig]
opt-level = 3
[profile.dev.package.rsa]
opt-level = 3
[profile.dev.package.crypto-bigint]
opt-level = 3
[profile.dev.package.p256]
opt-level = 3
[profile.dev.package.primeorder]
opt-level = 3
[profile.dev.package.ecdsa]
opt-level = 3
[profile.dev.package.elliptic-curve]
opt-level = 3

# MuPDF built for debugging draws pages slowly, in `tauri dev` and the
# helper's tests too; the glue builds it optimized at opt-level 3 (make's
# `build=release`)
[profile.dev.package.mupdf-sys]
opt-level = 3

# the layout engine for the webview, see scripts/build-engine.sh
[profile.wasm]
inherits = "release"
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

# the same, optimized for size, see "Size" in .claude/rules/layout-engine.md
# for how they compare
[profile.wasm-small]
inherits = "wasm"
opt-level = "s"
