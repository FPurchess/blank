[package]
name = "blank"
version = "3.0.0"
description = "Blank is a minimalist, opinionated markdown editor made for writing - keyboard-first with PDF-Export, available for Linux, macOS and Windows"
authors = ["Florian Purchess <florian.purchess@googlemail.com>"]
license = "AGPL-3.0-only"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "blank_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[workspace]
members = ["layout", "drawings"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-notification = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2.3"
# the minor version must match @tauri-apps/plugin-http
tauri-plugin-http = "~2.6"
spellbook = "0.4"
sha2 = "0.10"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "stream"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
futures-util = { version = "0.3", default-features = false }
tokio = { version = "1", features = ["fs", "sync", "time"] }
# what comes with the print PDF, encoded for a header (src/print/mod.rs)
percent-encoding = "2"
# the system's fonts for scripts Blank's fonts lack, see src/fonts.rs
fontique = "0.11"
unicode-script = "0.5"
# the version fontique uses; reads a fallback font's licence (fsType) and outlines
read-fonts = "0.41"
# Blank's log, in the system's log folder (src/logging.rs); log is the
# facade it and Tauri's crates write through. The minor version must match
# @tauri-apps/plugin-log; 2.10 needs a newer tauri.
tauri-plugin-log = "~2.9"
log = "0.4"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-cli = "2"
# every file opened becomes a tab in the running window (src/open.rs); 2.4,
# which works with tauri 2.11
tauri-plugin-single-instance = "~2.4"

# the primary selection, which a middle click pastes (src/primary.rs); the
# version tauri's webview already uses
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
# whether there is a session bus for the single-instance plugin (src/open.rs);
# the version it uses
zbus = "5"
# names Blank's window for the print portal's dialog, on X11 and Wayland
# (src/print/linux.rs); on zbus's async-io, as above
ashpd = { version = "0.13", default-features = false, features = ["async-io", "raw_handle", "wayland"] }
raw-window-handle = "0.6"
# runs the print portal's calls on a thread of their own (src/print/linux.rs)
async-io = "2"

# the print panel for the print PDF (src/print/macos.rs); the versions tauri's
# webview already uses
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSData", "NSDictionary", "NSGeometry", "NSObject", "NSString", "NSValue", "objc2-core-foundation"] }
objc2-app-kit = { version = "0.3", features = ["NSPrintInfo", "NSPrintOperation", "NSPrinter"] }
objc2-pdf-kit = { version = "0.3", features = ["PDFDocument", "objc2-app-kit"] }

# WebView2's print dialog for the print PDF (src/print/windows.rs); the
# versions tauri's webview already uses
[target.'cfg(target_os = "windows")'.dependencies]
webview2-com = "0.38"
windows = "0.61"

[dev-dependencies]
tempfile = "3"
tiny_http = "0.12"

# checking and suggesting are slow without optimizations, which would make
# `tauri dev` and the debug builds of the e2e tests lag
[profile.dev.package.spellbook]
opt-level = 3

# the layout engine for the webview, see scripts/build-engine.sh
[profile.wasm]
inherits = "release"
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

# the same, optimized for size, see "Size" in .claude/rules/layout-engine.md
# for how they compare
[profile.wasm-small]
inherits = "wasm"
opt-level = "s"
