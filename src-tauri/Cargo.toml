[package]
name = "blank"
version = "2.1.0"
description = "Blank is a minimalist, opinionated markdown editor made for writing - purely keyboard-based with PDF-Export, available for Linux, macOS and Windows"
authors = ["Florian Purchess <florian.purchess@googlemail.com>"]
license = "AGPL-3.0-only"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "blank_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-notification = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2.3"
# the minor version must match @tauri-apps/plugin-http
tauri-plugin-http = "~2.6"
spellbook = "0.4"
sha2 = "0.10"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "stream"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
futures-util = { version = "0.3", default-features = false }
tokio = { version = "1", features = ["fs", "sync"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-cli = "2"


[dev-dependencies]
tempfile = "3"
tiny_http = "0.12"

# checking and suggesting are slow without optimizations, which would make
# `tauri dev` and the debug builds of the e2e tests lag
[profile.dev.package.spellbook]
opt-level = 3
