<svg id="d" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 548.27685546875 450" style="max-width: 548.27685546875px;" role="graphics-document document" aria-roledescription="pie"><style>#d{font-family:IBM Plex Sans;font-size:16px;fill:#101010;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#d .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#d .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#d .error-icon{fill:#f0f0f0;}#d .error-text{fill:#0f0f0f;stroke:#0f0f0f;}#d .edge-thickness-normal{stroke-width:1px;}#d .edge-thickness-thick{stroke-width:3.5px;}#d .edge-pattern-solid{stroke-dasharray:0;}#d .edge-thickness-invisible{stroke-width:0;fill:none;}#d .edge-pattern-dashed{stroke-dasharray:3;}#d .edge-pattern-dotted{stroke-dasharray:2;}#d .marker{fill:#202020;stroke:#202020;}#d .marker.cross{stroke:#202020;}#d svg{font-family:IBM Plex Sans;font-size:16px;}#d p{margin:0;}#d .pieCircle{stroke:black;stroke-width:2px;opacity:0.7;}#d .pieCircle.highlighted{scale:1.05;opacity:1;}#d .pieCircle.highlightedOnHover:hover{transition-duration:250ms;scale:1.05;opacity:1;}#d .pieOuterCircle{stroke:black;stroke-width:2px;fill:none;}#d .pieTitleText{text-anchor:middle;font-size:25px;fill:#101010;font-family:IBM Plex Sans;}#d .slice{font-family:IBM Plex Sans;fill:#101010;font-size:17px;}#d .legend text{fill:#101010;font-family:IBM Plex Sans;font-size:17px;}#d .node .neo-node{stroke:#202020;}#d [data-look="neo"].node rect,#d [data-look="neo"].cluster rect,#d [data-look="neo"].node polygon{stroke:url(#d-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#d [data-look="neo"].swimlane.cluster rect{filter:none;}#d [data-look="neo"].node path{stroke:url(#d-gradient);stroke-width:1px;}#d [data-look="neo"].node .outer-path{filter:drop-shadow( 1px 2px 2px